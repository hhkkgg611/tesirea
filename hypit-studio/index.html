<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101210">
  <title>Hypit Studio · Make it yours</title>
  <link rel="stylesheet" href="simple.css">
  <script src="simple.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Hypit Studio home"><span class="brand-icon">h.</span> hypit <span>STUDIO</span></a>
    <div class="header-actions"><button class="quiet" id="projects-button">My videos</button><button class="connection" id="connection-button"><i></i><span>Connect Runware</span></button></div>
  </header>
  <main id="app"><div class="loading">Opening your studio…</div></main>
  <footer><span>Reference in. Your version out.</span><span>Made with Runware <span class="footer-dot">·</span> Saved on this computer</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <input type="file" id="video-input" accept="video/*,.mp4,.mov,.webm" hidden>
  <input type="file" id="image-input" accept="image/*" hidden>
</body>
</html>
